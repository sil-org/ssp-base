# Adds a second listener on the port published for manual browser testing
# (see compose.yaml's "8088:8088" mapping for ssp-idp4.local), alongside the
# base image's port 80 listener used by automated/headless tests over the
# Docker-internal network. This lets Apache report the correct SERVER_PORT
# for each access path, so SimpleSAMLphp's relative 'baseurlpath' resolves
# the right entity ID per request instead of always defaulting to port 80.
Listen 8088

<VirtualHost _default_:8088>
  DocumentRoot /data/vendor/simplesamlphp/simplesamlphp/public/
  RewriteEngine On
  DirectoryIndex index.php

  <Directory /data/vendor/simplesamlphp/simplesamlphp/public/>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  LogLevel info
  CustomLog /var/log/apache2/access.log combined
</VirtualHost>
